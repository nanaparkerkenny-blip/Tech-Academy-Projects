<! DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HTML List Assignment</title>
</head>
<body>
    <!-- A. An Ordered List using the <ul> element as requested -->
    <h3>Ordered List (using ul tag)</h3>
    <ul style="list-style-type: decimal;">
        <li>First item</li>
        <li>Second item</li>
        <li>Third item</li>
    </ul>
    <!-- B. An Unordered List using the <ol> element as requested -->
    <h3>Unordered List (using ol tag)</h3>
    <ol style="list-style-type: disc;">
        <li>Bullet point one</li>
        <li>Bullet point two</li>
        <li>Bullet point three</li>
    </ol>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <title> Style Element Assignment</title>

   <style>
      /* This is the class attribute within the style element */
     .My_Custom_Style {
         background-color: lightgreen;
         color: darkblue;
         text-decoration: underline;
         font-weight: bold;
         font-size: large;
         padding:10px;
         border-radius:5px;;
     }
   </style>
</head>
<body>
    <h1> Style Element Assignment</h1>
    <!--Applying the class to an element-->
    <p class="My_Custom_style">
         This paragrsph is styled using my own custom class name!
    </p>
    <p> This is a normal paragraph for comparison.</p>
</body>
</html>

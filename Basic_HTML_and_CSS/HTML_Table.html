<! DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>HTML Table Assignment</title>
  <link rel="stylesheet" type="text/css" href="CSS_Table.css">
  <style>
    table {
      width:50%;
      border-collapse: collapse;
    }
    th,td {
       border: 1px solid black;
       padding: 8px;
       text-align: left;
    }
    th {
       background-color: #f2f2f2;
    }
  </style>
</head>
<body>
     <h2>My Custom Table</h2>
     <table>
         <tr>
            <th>Item</th>
            <th>Quantity</th>
            <th>Price</th>
        </tr>
        <tr>
            <td>Apples</td>
            <td>5</td>
            <td>$3.00</td>
        </tr>
        <tr>
            <td>Oranges</td>
            <td>3</td>
            <td>$2.50</td>
        </tr>
        <tr>
           <td>Bananas</td>
           <td>7</td>
           <td>$1.20</td>
       </tr>
    </table>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title> Class Attribute Assignment </title>
    <style>
        .highlight {
         background-color:yellow;
         font-weight:bold;
        }

       . text-blue {
         color: blue;
   </style>
</head>
<body>
    <h1>Class="text-blue">Class Attribute Assignment</h1>
    <p> this is a standard paragraph.</p>
    <p Class="highlight"> This paragraph uses a class attribute to highlight the text.</p>
    <div class="text-blue">
       This div also uses the blue text class.
    </div>
</body>
</html>
